<style>
:root{--bg:#f1f5ef;--card:#fff;--ink:#14281f;--mute:#5d7066;--line:#dbe4da;--pri:#0f6b5c;--onpri:#fff;--soon:#b87503;--soonbg:#fdf1d6;--late:#b3361b;--latebg:#fbe3dc;--ok:#e3efe9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

*{box-sizing:border-box}

input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1}
.seg{display:flex;gap:6px}.seg button{flex:1}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.hb{margin:8px 0}.hbl{display:flex;justify-content:space-between;font-size:14px}.hbt{height:10px;background:var(--ok);border-radius:99px;overflow:hidden;margin-top:4px}.hbt i{display:block;height:100%;border-radius:99px}.leg{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}.note{color:var(--mute);font-size:13px;margin:0}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 13px;font:inherit}.chips button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.amtbig{font-size:38px!important;font-weight:800;text-align:center;font-family:"Bricolage Grotesque",system-ui,sans-serif}
a{color:var(--pri);font-weight:700}
nav button{font-size:12px;letter-spacing:-.01em;padding:14px 1px}
.x{float:right;border:0;background:var(--ok);color:var(--ink);border-radius:99px;width:34px;height:34px;font-size:15px;cursor:pointer;margin:-4px -4px 0 8px}
.sheet h2{margin-top:0}

.dot{flex:0 0 10px;width:10px;height:10px;border-radius:99px;background:var(--line);margin-top:6px}
.dot.good{background:#1f9d6b}.dot.warn{background:var(--soon)}.dot.bad{background:var(--late)}
.hrow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}.hrow:last-of-type{border-bottom:0}

.gd{color:#1f9d6b}.bd{color:var(--late)}
.stat[data-act]{cursor:pointer}

.toast{display:flex;align-items:center;gap:10px;max-width:92vw;z-index:120}
input[type=file]{padding:8px}
a.btn{display:inline-block}
body.hide main .tbl td{filter:blur(8px)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;padding:8px 1px 9px}
nav button.on{box-shadow:none}nav button.on svg{stroke-width:2.4}nav button.on span{font-weight:800}
.fab2{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--pri),#14b8a6);color:var(--onpri);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 8px 22px rgba(15,107,92,.4)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.ft{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:14px 4px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}.ft span{font-size:26px}
.ci{flex:0 0 38px;width:38px;height:38px;border-radius:12px;background:var(--ok);display:flex;align-items:center;justify-content:center;font-size:19px}
.row .ci+div{flex:1;min-width:0}
.dh{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;font-weight:700;margin:14px 2px 6px}
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 0 10px;margin:8px 0 0;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.sc{flex:0 0 auto;min-width:142px;background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer}.sc small{display:block;color:var(--mute);font-size:12px;margin-bottom:2px}.sc.add{border-style:dashed}
.cal i{cursor:default;background:var(--ok)}.cal i.has{background:var(--pri);color:var(--onpri);font-weight:700;cursor:pointer}.cal i.late{background:var(--late);color:#fff;font-weight:700;cursor:pointer}.cal i.tod{outline:2px solid var(--ink)}
.cal i:nth-child(-n+7),.cal i:empty{background:none}
.qrbox{background:#fff;border-radius:14px;padding:8px;width:220px;max-width:70%;margin:8px auto}.qrbox svg{display:block;width:100%;height:auto}
.steps{margin:8px 0 4px;padding-left:22px}.steps li{margin:6px 0}
</style></head><body>
<main id="app"><p class="sub">Opening your data…</p></main>
<nav><div id="nav"></div></nav>
<div id="over"></div><div id="view"></div><div id="lock"></div><div id="toast"></div>
<script>
"use strict";
/* ===== core: constants, state, small helpers ===== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const K="due-and-spend.v1",DEFRATE=26,VER="14";
const COLLS=["acc","tx","dates","inv","loans","goals","bud","rec","docs"],LOCAL=["cfg","nw","bin","del"];
const blank=()=>({acc:[],tx:[],dates:[],inv:[],loans:[],goals:[],bud:[],rec:[],docs:[],bin:[],del:[],nw:{},cfg:{rate:DEFRATE,view:"INR"}});
let S=blank(),tab="home",mon="",qs="",sstat="Sync off";

const TYPES={premium:"Premium",fd:"FD maturity",emi:"EMI",renewal:"Renewal"};
const REP={none:["Does not repeat",0],monthly:["Every month",1],quarterly:["Every 3 months",3],half:["Every 6 months",6],yearly:["Every year",12]};
const CATS=["Food","Travel","Bills","Shopping","Health","Rent","Other"];
const IK={fd:"Fixed deposit",mf:"Mutual fund",stock:"Stocks",ppf:"PPF / EPF",gold:"Gold",other:"Other"};
const ATYPE={bank:"Bank account",cash:"Cash",wallet:"Wallet",card:"Credit card"};
const KIND={out:"Spent",in:"Income",save:"Saved",adj:"Adjustment",tr:"Transfer"};
const TABS=[["home","Home"],["dates","Dues"],["invest","Wealth"],["acc","Accounts"],["spend","Spend"],["rep","Reports"]];
const CURS=[["INR","INR (₹)"],["QAR","QAR"]];

/* text and ids */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const p2=n=>String(n).padStart(2,"0");
const same=(a,b)=>{a=String(a||"").trim().toLowerCase();b=String(b||"").trim().toLowerCase();return !!a&&!!b&&(a.includes(b)||b.includes(a))};

/* dates (all dates are local YYYY-MM-DD strings) */
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const D=s=>new Date(s+"T00:00:00");
const dl=d=>Math.round((D(d)-D(today()))/864e5);
const addM=(s,n)=>{const d=D(s),day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()!==day)d.setDate(0);return iso(d)};
const addMon=(m,n)=>addM(m+"-01",n).slice(0,7);
const dim=m=>new Date(+m.slice(0,4),+m.slice(5),0).getDate();
const mEnd=m=>m+"-"+p2(dim(m));
const plus=n=>{const d=D(today());d.setDate(d.getDate()+n);return iso(d)};
const fmt=d=>D(d).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
const mlab=m=>D(m+"-01").toLocaleDateString("en-IN",{month:"short"});
const mlong=m=>D(m+"-01").toLocaleDateString("en-IN",{month:"long",year:"numeric"});
const when=n=>n<0?`${-n} ${n==-1?"day":"days"} overdue`:n==0?"Today":n==1?"Tomorrow":`In ${n} days`;
const cls=n=>n<0?"late":n<=7?"soon":"";

/* money */
const nf=(n,d=2)=>Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:d});
const fmx=(n,c)=>{n=+n||0;return (n<0?"−":"")+(c=="QAR"?"QAR ":"₹")+nf(Math.abs(n))};
const inr=n=>fmx(n,"INR");
const fx=()=>+S.cfg.rate||DEFRATE;
const cv=(n,f,t)=>{n=+n||0;f=f||"INR";t=t||"INR";return f==t?n:t=="INR"?n*fx():n/fx()};
const V=()=>S.cfg.view=="QAR"?"QAR":"INR";
const iv=(n,c)=>cv(n,c,V());
const fm=n=>fmx(n,V());
const fmr=n=>fmx(Math.round(+n||0),V());
const sh=n=>{n=+n||0;const a=Math.abs(n),s=n<0?"−":"";return s+(a>=1e7?(a/1e7).toFixed(1)+"Cr":a>=1e5?(a/1e5).toFixed(1)+"L":a>=1e3?Math.round(a/1e3)+"k":String(Math.round(a)))};
const pct=(a,b)=>b?Math.min(100,Math.max(0,Math.round(a/b*100))):0;

/* form and sheet helpers */
const F=(id,l,val,t,x)=>{t=t||"text";return `<label for="${id}">${l}</label><input id="${id}" type="${t}" ${t=="number"?'inputmode="decimal" step="any"':""} value="${esc(val??"")}" ${x||""}>`};
const SEL=(id,l,o,s,x)=>`<label for="${id}">${l}</label><select id="${id}" ${x||""}>${o.map(([k,t])=>`<option value="${esc(k)}" ${String(k)==String(s??"")?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
const DL=(id,a)=>`<datalist id="${id}">${[...new Set(a)].filter(Boolean).slice(0,30).map(c=>`<option value="${esc(c)}"></option>`).join("")}</datalist>`;
const ACCS=()=>S.acc.map(k=>[k.id,k.name+" ("+k.cur+")"]);
const v=s=>{const e=$("#"+s);return e?e.value:""};
const btns=(sv,id,del)=>`<div class="acts"><button class="btn" data-act="${sv}" data-id="${id||""}">Save</button>${id&&del?`<button class="btn del" data-act="${del}" data-id="${id}">Delete</button>`:""}</div>`;
function sheet(h){$("#over").innerHTML=h?`<div class="back" data-act="close"><div class="sheet"><button class="x" data-act="closeX" aria-label="Close">✕</button>${h}</div></div>`:""}
let toastT=null,undoFn=null;
function toast(t,undo){undoFn=undo||null;$("#toast").innerHTML=`<div class="toast">${esc(t)}${undo?` <button class="btn sm" data-act="undo">Undo</button>`:""}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>{$("#toast").innerHTML="";undoFn=null},undo?7000:2600)}

/* records */
const whoAmI=()=>{try{return me&&me.emailVerified&&me.email||""}catch(e){return ""}};
const stamp=(o,old)=>{o.ct=(old&&old.ct)||o.ct||Date.now();o.ut=Date.now();const w=whoAmI();if(w&&!o.by)o.by=w;return o};
function put(c,o){const i=S[c].findIndex(x=>x.id==o.id);if(i<0)S[c].push(o);else S[c][i]=o;return o}
function done(){save();sheet("");render()}
const stampNote=o=>o&&o.ct?`<p class="note">Added ${fmt(iso(new Date(o.ct)))}${o.ut&&o.ut-o.ct>60000?" · edited "+fmt(iso(new Date(o.ut))):""}</p>`:"";

/* ===== storage: phone database (IndexedDB) with a browser-storage fallback, optional PIN encryption ===== */
const DBN="due-and-spend-db",FDBN="due-and-spend-files";
let _db=null,_fdb=null,KEY=null,META={v:2,ts:0,enc:null},useLS=false,lastJSON={},storeErr="";
const te=new TextEncoder(),td=new TextDecoder();

function openDB(name,stores){return new Promise((res,rej)=>{let r;const to=setTimeout(()=>rej(new Error("timeout")),5000);
  try{r=indexedDB.open(name,1)}catch(e){clearTimeout(to);return rej(e)}
  r.onupgradeneeded=()=>stores.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s)});
  r.onsuccess=()=>{clearTimeout(to);res(r.result)};r.onerror=()=>{clearTimeout(to);rej(r.error||new Error("database"))};r.onblocked=()=>{clearTimeout(to);rej(new Error("blocked"))}})}
const mainDB=()=>_db||(_db=openDB(DBN,["kv","snaps"]));
const fileDB=()=>_fdb||(_fdb=openDB(FDBN,["f"]));
/* run one transaction; fn returns a request, an array of requests, or nothing */
function run(dbp,store,mode,fn){return dbp.then(d=>new Promise((res,rej)=>{const t=d.transaction(store,mode);let q;try{q=fn(t.objectStore(store))}catch(e){rej(e);return}
  t.oncomplete=()=>res(Array.isArray(q)?q.map(x=>x.result):q&&typeof q=="object"&&"result" in q?q.result:undefined);
  t.onerror=()=>rej(t.error||new Error("transaction"));t.onabort=()=>rej(t.error||new Error("aborted"))}))}

/* encryption: PBKDF2 → AES-GCM */
async function deriveKey(pin,salt,iter){const b=await crypto.subtle.importKey("raw",te.encode(pin),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function sealBuf(key,buf){const iv=crypto.getRandomValues(new Uint8Array(12));return {iv,ct:await crypto.subtle.encrypt({name:"AES-GCM",iv},key,buf)}}
const openBuf=(key,o)=>crypto.subtle.decrypt({name:"AES-GCM",iv:o.iv},key,o.ct);
const seal=(key,str)=>sealBuf(key,te.encode(str));
const unseal=async(key,o)=>td.decode(await openBuf(key,o));
async function sha(s){const b=await crypto.subtle.digest("SHA-256",te.encode("ds:"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

/* save: a mirror in browser storage first (when not encrypted), then only the changed tables in the database */
let saveQ=Promise.resolve();
function persist(force){saveQ=saveQ.then(()=>persistNow(force)).then(()=>{storeErr=""},e=>{storeErr=String(e&&e.message||e);console.warn("save failed",e)});return saveQ}
async function persistNow(force){META.ts=Date.now();
  if(!KEY)try{localStorage.setItem(K,JSON.stringify({...S,_ts:META.ts}))}catch(e){}
  if(useLS)return;
  const ch=[];for(const c of [...COLLS,...LOCAL]){const j=JSON.stringify(S[c]);if(force||lastJSON[c]!==j)ch.push([c,j])}
  const vals=[];for(const [c,j] of ch)vals.push(["c:"+c,KEY?await seal(KEY,j):j]);
  const meta={...META};
  await run(mainDB(),"kv","readwrite",s=>{vals.forEach(([k,val])=>s.put(val,k));s.put(meta,"meta")});
  ch.forEach(([c,j])=>lastJSON[c]=j)}
function save(){try{snapNW()}catch(e){}try{prefsTouch()}catch(e){}persist();try{nativeNotifyLater()}catch(e){}try{syncMark()}catch(e){}try{cloudMark()}catch(e){}}

function adopt(o){const b=blank();for(const c of [...COLLS,...LOCAL])if(o[c]!=null)b[c]=o[c];if(Array.isArray(o.tr))b.tr=o.tr;b.cfg={...blank().cfg,...(b.cfg||{})};S=b}
async function readAll(){const cs=[...COLLS,...LOCAL],vs=await run(mainDB(),"kv","readonly",s=>cs.map(c=>s.get("c:"+c))),o={};
  for(let i=0;i<cs.length;i++){let val=vs[i];if(val==null)continue;if(typeof val!="string")val=await unseal(KEY,val);o[cs[i]]=JSON.parse(val);lastJSON[cs[i]]=val}
  adopt(o)}
/* returns "ready" or "locked" */
async function loadAll(){let ls=null,meta=null;try{ls=JSON.parse(localStorage.getItem(K)||"null")}catch(e){}
  try{meta=await run(mainDB(),"kv","readonly",s=>s.get("meta"))||null}catch(e){useLS=true}
  if(!meta){META={v:2,ts:0,enc:null};if(ls)adopt(ls);mig();if(!useLS)try{await persistNow(true)}catch(e){useLS=true}return "ready"}
  META=meta;if(META.enc)return "locked";
  await readAll();if(ls&&(ls._ts||0)>META.ts)adopt(ls);mig();return "ready"}
const storeLabel=()=>useLS?"browser storage":META.enc?"encrypted phone database":"phone database";

/* PIN lock */
async function tryPin(pin){try{const k=await deriveKey(pin,META.enc.salt,META.enc.iter);if(await unseal(k,META.enc.check)==="ok")return k}catch(e){}return null}
async function lockOn(pin){if(useLS)throw new Error("App lock needs the phone database, which isn’t available here");
  const salt=crypto.getRandomValues(new Uint8Array(16)),iter=250000,key=await deriveKey(pin,salt,iter),oldKey=KEY,oldEnc=META.enc;
  META.enc={salt,iter,check:await seal(key,"ok")};KEY=key;const legacy=S.cfg.pin;delete S.cfg.pin;
  try{await persistNow(true)}catch(e){KEY=oldKey;META.enc=oldEnc;if(legacy)S.cfg.pin=legacy;throw e}
  try{localStorage.removeItem(K)}catch(e){}
  await convertFiles(true).catch(()=>{});await resealSnaps(false).catch(()=>{})}
async function lockOff(){await convertFiles(false);await resealSnaps(true).catch(()=>{});KEY=null;META.enc=null;delete S.cfg.cred;await persistNow(true)}

/* attachments (encrypted too while the lock is on) */
async function fput(id,blob){let val=blob;if(KEY)val={...(await sealBuf(KEY,await blob.arrayBuffer())),type:blob.type||""};return run(fileDB(),"f","readwrite",s=>{s.put(val,id)})}
async function fget(id){const val=await run(fileDB(),"f","readonly",s=>s.get(id));if(val&&val.iv)return new Blob([await openBuf(KEY,val)],{type:val.type||""});return val}
const fdel=id=>run(fileDB(),"f","readwrite",s=>{s.delete(id)}).catch(()=>{});
async function convertFiles(toEnc){const keys=await run(fileDB(),"f","readonly",s=>s.getAllKeys());
  for(const id of keys){const val=await run(fileDB(),"f","readonly",s=>s.get(id));if(!val)continue;
    if(toEnc&&!val.iv&&val.arrayBuffer){const o={...(await sealBuf(KEY,await val.arrayBuffer())),type:val.type||""};await run(fileDB(),"f","readwrite",s=>{s.put(o,id)})}
    if(!toEnc&&val.iv){const b=new Blob([await openBuf(KEY,val)],{type:val.type||""});await run(fileDB(),"f","readwrite",s=>{s.put(b,id)})}}}

/* automatic daily copies (last 7 days the app was opened) */
async function snapPut(k){const j=bk(),val=KEY?await seal(KEY,j):j;await run(mainDB(),"snaps","readwrite",s=>{s.put({k,ts:Date.now(),v:val},k)})}
const hasData=()=>S.tx.length>0||S.dates.length>0||S.inv.length>0||S.loans.length>0||S.goals.length>0||S.acc.length>1;
async function snapDaily(){if(useLS||!hasData())return;try{const ks=await run(mainDB(),"snaps","readonly",s=>s.getAllKeys()),d=today();if(ks.includes(d))return;await snapPut(d);
  const old=ks.filter(k=>/^\d{4}-\d\d-\d\d$/.test(k)).sort().slice(0,-6);if(old.length)await run(mainDB(),"snaps","readwrite",s=>{old.forEach(k=>s.delete(k))})}catch(e){}}
const snapList=()=>run(mainDB(),"snaps","readonly",s=>s.getAll()).then(a=>a.sort((x,y)=>y.ts-x.ts));
async function snapRead(k){const o=await run(mainDB(),"snaps","readonly",s=>s.get(k));if(!o)throw new Error("That copy is no longer there");return typeof o.v=="string"?o.v:unseal(KEY,o.v)}
async function resealSnaps(toPlain){const all=await run(mainDB(),"snaps","readonly",s=>s.getAll()),out=[];
  for(const o of all){try{const j=typeof o.v=="string"?o.v:await unseal(KEY,o.v);out.push({...o,v:toPlain?j:await seal(KEY,j)})}catch(e){}}
  await run(mainDB(),"snaps","readwrite",s=>{s.clear();out.forEach(o=>s.put(o,o.k))})}

/* backup and restore */
const bkObj=()=>({app:"due-and-spend",v:2,at:Date.now(),...Object.fromEntries(COLLS.map(c=>[c,S[c]])),nw:S.nw,cfg:{rate:S.cfg.rate,view:S.cfg.view,fixedCats:S.cfg.fixedCats,theme:S.cfg.theme}});
const bk=()=>JSON.stringify(bkObj());
const allAtt=()=>[...S.dates,...S.inv,...S.docs].flatMap(x=>x.att||[]);
async function b64(blob){const u=new Uint8Array(await blob.arrayBuffer());let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
function unb64(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function bkFull(){const o=bkObj();o.files={};for(const a of allAtt()){try{const b=await fget(a.id);if(b)o.files[a.id]={type:b.type||a.type||"",data:await b64(b)}}catch(e){}}return JSON.stringify(o)}
async function restoreFrom(text){let o;try{o=JSON.parse(text)}catch(e){throw new Error("That isn’t a valid backup")}
  if(!o||!Array.isArray(o.dates)||!Array.isArray(o.tx))throw new Error("That isn’t a valid backup");
  if(!useLS&&hasData())await snapPut("before-restore").catch(()=>{});
  const keep={cred:S.cfg.cred,last:S.cfg.lastBk,hide:S.cfg.hide},bin=S.bin;adopt(o);S.bin=bin;delete S.cfg.pin;delete S.cfg.cred;if(keep.cred)S.cfg.cred=keep.cred;if(keep.last)S.cfg.lastBk=keep.last;if(keep.hide)S.cfg.hide=keep.hide;mig();
  /* a restore replaces everything, on every synced device too */
  try{if(CLS.on){CLS.force=true;clv()}if(SY.on){SY.force=true;syv()}}catch(e){}
  if(o.files)for(const id in o.files){try{await fput(id,new Blob([unb64(o.files[id].data)],{type:o.files[id].type||""}))}catch(e){}}
  save()}

/* recycle bin: deleted records are kept for 30 days */
function trash(c,id){const i=S[c].findIndex(x=>x.id==id);if(i<0)return null;const r=S[c].splice(i,1)[0],at=Date.now();S.bin.push({c,r,at});S.del.push({id:r.id,at});return r}
function untrash(id){const i=S.bin.findIndex(b=>b.r.id==id);if(i<0)return null;const b=S.bin.splice(i,1)[0];S.del=S.del.filter(t=>t.id!=b.r.id);b.r.ut=Date.now();if(!S[b.c].some(x=>x.id==b.r.id))S[b.c].push(b.r);if(b.c=="tx")linkApply(b.r,1);return b}
function purgeBin(all){const lim=all?Infinity:Date.now()-30*864e5,n=S.bin.length;S.bin=S.bin.filter(b=>{if(b.at>=lim)return true;(b.r.att||[]).forEach(a=>fdel(a.id));return false});return n!=S.bin.length}

/* ===== ledger: one list of money movements, with links to dues, loans, goals and investments ===== */
/* tx kinds: out (spent), in (income), save (saved), adj (neutral balance change), tr (transfer: acc → to) */
function mig(){
  for(const c of COLLS)if(!Array.isArray(S[c]))S[c]=[];
  if(!Array.isArray(S.bin))S.bin=[];if(!Array.isArray(S.del))S.del=[];if(!S.nw||typeof S.nw!="object")S.nw={};
  S.cfg=S.cfg||{};S.cfg.rate=+S.cfg.rate||DEFRATE;S.cfg.view=S.cfg.view=="QAR"?"QAR":"INR";
  if(S.cfg.fixedCats==null)S.cfg.fixedCats="Rent, EMI, Premium, Renewal, Bills";
  S.tx.forEach(x=>{if(x.kind!="tr"&&!x.acc){const c=x.cur||"INR";let k=S.acc.find(q=>q.id=="def_"+c);if(!k){k={id:"def_"+c,name:c=="INR"?"Cash / Main":"Cash (QAR)",type:"cash",cur:c,open:0};S.acc.push(k)}x.acc=k.id;x.cur=c}});
  if(!S.acc.length)S.acc.push({id:"def_INR",name:"Cash / Main",type:"cash",cur:"INR",open:0});
  if(Array.isArray(S.tr)&&S.tr.length){const have=new Set(S.tx.map(x=>x.id));S.tr.forEach(t=>{if(!have.has(t.id))S.tx.push({id:t.id,kind:"tr",acc:t.from,to:t.to,amt:+t.amt||0,got:+t.got||0,fee:+t.fee||0,date:t.date,note:t.note||""})})}
  delete S.tr;
  S.tx.forEach(x=>{x.amt=+x.amt||0;if(x.kind=="tr"&&!x.cur)x.cur=ac(x.acc).cur});
  S.dates.forEach(i=>{i.cur=i.cur||"INR";if(!REP[i.rep])i.rep="none";if(!TYPES[i.type])i.type="renewal"});
  S.inv.forEach(x=>{x.cur=x.cur||"INR";if(!IK[x.kind])x.kind="other"});
  S.loans.forEach(l=>{l.cur=l.cur||"INR";l.paid=+l.paid||0;l.total=+l.total||0;l.emi=+l.emi||0});
  S.goals.forEach(g=>{g.cur=g.cur||"INR"})}

const ac=id=>S.acc.find(k=>k.id==id)||{id:"",name:"Unknown",cur:"INR",open:0};
const an=id=>ac(id).name;
function bal(k){let b=+k.open||0;for(const x of S.tx){if(x.kind=="tr"){if(x.acc==k.id)b-=(+x.amt||0)+(+x.fee||0);if(x.to==k.id)b+=+x.got||0}else if(x.acc==k.id)b+=(x.kind=="in"||x.kind=="adj")?+x.amt:-x.amt}return b}
const tot=(to,f)=>S.acc.filter(f||(()=>true)).reduce((s,k)=>s+cv(bal(k),k.cur,to),0);
/* amount of an entry in the view currency, at the rate saved with the entry */
const ca=x=>{const to=V(),c=x.cur||"INR";if(c==to)return +x.amt;const r=+x.fx||fx();return to=="INR"?x.amt*r:x.amt/r};
const sumV=l=>l.reduce((a,x)=>a+ca(x),0);
const mTx=(m,k)=>S.tx.filter(x=>x.kind==k&&x.date.startsWith(m));
const mSum=(m,k)=>sumV(mTx(m,k));
const fixedSet=()=>new Set(String(S.cfg.fixedCats||"").split(",").map(s=>s.trim().toLowerCase()).filter(Boolean));
const isFixed=(x,fs)=>!!x.rec||!!(x.link&&(x.link.t=="due"||x.link.t=="loan"))||(fs||fixedSet()).has((x.cat||"").toLowerCase());
const linked=(t,id)=>S.tx.filter(x=>x.link&&x.link.t==t&&x.link.id==id).sort((a,b)=>b.date.localeCompare(a.date));

/* a linked entry changes the thing it is linked to; s=+1 applies it, s=-1 takes it back */
function linkApply(x,s){const L=x.link;if(!L)return;
  if(L.t=="due"){const i=S.dates.find(d=>d.id==L.id);if(!i)return;i.ut=Date.now();if(s>0){if(x.nd)i.date=x.nd;else i.done=true}else{if(x.pd)i.date=x.pd;i.done=false}}
  if(L.t=="loan"){const l=S.loans.find(q=>q.id==L.id);if(!l)return;l.ut=Date.now();
    if(s>0){if(x.lo==null){const o=+l.out||0,r=(+l.rate||0)/1200;x.lo=o?Math.min(o,Math.max(0,l.emi-o*r)):0}l.paid=(+l.paid||0)+1;if(+l.out)l.out=Math.max(0,+l.out-x.lo);if(l.next)l.next=addM(l.next,1)}
    else{l.paid=Math.max(0,(+l.paid||0)-1);if(x.lo)l.out=(+l.out||0)+x.lo;if(l.next)l.next=addM(l.next,-1)}}
  if(L.t=="goal"){const g=S.goals.find(q=>q.id==L.id);if(!g)return;g.ut=Date.now();if(x.gv==null)x.gv=cv(x.amt,x.cur,g.cur);g.saved=Math.max(0,(+g.saved||0)+s*x.gv)}
  if(L.t=="inv"){const n=S.inv.find(q=>q.id==L.id);if(!n)return;n.ut=Date.now();if(x.iv==null)x.iv=cv(x.amt,x.cur,n.cur);
    if(x.kind=="adj"){const val=invVal(n,true);if(x.cap==null)x.cap=val>0?Math.min(+n.inv||0,x.iv*(+n.inv||0)/val):0;
      if(s>0){n.val=Math.max(0,val-x.iv);n.inv=Math.max(0,(+n.inv||0)-x.cap);if(n.val<.005&&n.inv<.005){n.val=0;n.inv=0;n.closed=true}}
      else{n.val=val+x.iv;n.inv=(+n.inv||0)+x.cap;n.closed=false}}
    else{n.inv=Math.max(0,(+n.inv||0)+s*x.iv);if(+n.val)n.val=Math.max(0,+n.val+s*x.iv)}}}
function addTx(o){o.id=o.id||uid();o.ct=o.ct||Date.now();o.ut=o.ut||Date.now();{const w=whoAmI();if(w&&!o.by)o.by=w}o.fx=o.fx||fx();o.amt=+o.amt||0;S.tx.push(o);linkApply(o,1);return o}
function removeTx(id){const x=S.tx.find(q=>q.id==id);if(!x)return null;linkApply(x,-1);trash("tx",id);return x}

/* due dates */
const activeDues=()=>S.dates.filter(i=>!i.done).sort((a,b)=>a.date.localeCompare(b.date));
const dueAt=(i,k)=>{const m=addMon(i.date.slice(0,7),REP[i.rep][1]*k);return m+"-"+p2(Math.min(+i.day||+i.date.slice(8),dim(m)))};
function dueOcc(i,from,to){const st=REP[i.rep][1],out=[];for(let k=0;k<600;k++){const d=k?dueAt(i,k):i.date;if(d>to)break;if(d>=from)out.push(d);if(!st)break}return out}
const nextDue=i=>{if(!REP[i.rep][1])return null;let k=1,nd=dueAt(i,1);while(k<600&&dl(nd)<-400)nd=dueAt(i,++k);return nd};
const payAcc=(pref,cur)=>S.acc.find(k=>k.id==pref)||S.acc.find(k=>k.id==S.cfg.last)||S.acc.find(k=>k.cur==(cur||"INR"))||S.acc[0];
/* mark a due as paid (or an FD as received): logs it in the ledger and moves the date on */
function payDue(id){const i=S.dates.find(d=>d.id==id);if(!i||i.done)return null;const nd=nextDue(i),a=+i.amt||0,fd=i.type=="fd",prev={date:i.date,done:!!i.done};let tx=null;
  if(a){const pa=payAcc(i.pay,i.cur);tx=addTx({kind:fd?"adj":"out",acc:pa.id,amt:cv(a,i.cur,pa.cur),cur:pa.cur,cat:fd?"FD maturity":TYPES[i.type],note:i.name,date:today(),link:{t:"due",id},pd:i.date,nd})}
  else if(nd)i.date=nd;else i.done=true;
  i.ut=Date.now();return {i,nd,tx,prev}}

/* loans */
const loanLeft=l=>Math.max(0,(+l.total||0)-(+l.paid||0));
const loanOut=l=>{const left=loanLeft(l);if(!left)return 0;if(+l.out)return +l.out;const r=(+l.rate||0)/1200;return r?l.emi*(1-Math.pow(1+r,-left))/r:left*l.emi};
function loanOcc(l,from,to){const left=loanLeft(l),out=[],base=l.next||today();for(let k=0;k<left;k++){const d=addM(base,k);if(d>to)break;if(d>=from)out.push(d)}return out}
const loanEnd=l=>{const left=loanLeft(l);return left?addM(l.next||today(),left-1):null};
function payEmi(id){const l=S.loans.find(x=>x.id==id);if(!l||!loanLeft(l))return null;const pa=payAcc(l.acc,l.cur);
  return addTx({kind:"out",acc:pa.id,amt:cv(l.emi,l.cur,pa.cur),cur:pa.cur,cat:"EMI",note:l.name,date:today(),link:{t:"loan",id}})}
/* months needed to clear principal P with payment E at monthly rate r */
const nper=(P,E,r)=>P<=0?0:r?(E>r*P?-Math.log(1-r*P/E)/Math.log(1+r):Infinity):P/E;

/* recurring entries */
function recOcc(r,from,to){const out=[],end=to.slice(0,7);let m=from.slice(0,7);
  for(let k=0;k<60&&m<=end;k++,m=addMon(m,1)){if(m<r.from||(r.last&&m<=r.last))continue;const d=m+"-"+p2(Math.min(+r.day||1,dim(m)));if(d>=from&&d<=to)out.push(d)}return out}
function applyRec(){let ch=false;const t=today(),cm=t.slice(0,7);
  S.rec.forEach(r=>{if(!ac(r.acc).id)return;let m=r.last?addMon(r.last,1):r.from;
    for(let k=0;k<24&&m&&m<=cm;k++){const d=m+"-"+p2(Math.min(+r.day||1,dim(m)));if(d>t)break;
      const id="r_"+r.id+"_"+m,at=D(d).getTime();if(!S.tx.some(x=>x.id==id)&&!S.del.some(x=>x.id==id))addTx({id,ct:at,ut:at,kind:r.kind,acc:r.acc,amt:+r.amt,cur:ac(r.acc).cur,date:d,cat:r.cat,note:r.note||"Recurring",rec:r.id});r.last=m;r.ut=Date.now();ch=true;m=addMon(m,1)}});
  return ch}

/* everything expected between two dates: t = due | fd | emi | rec | recin */
function upcoming(from,to,incOverdue){const L=[];
  S.dates.forEach(i=>{if(i.done)return;const f=incOverdue&&i.date<from?i.date:from;dueOcc(i,f,to).forEach(d=>L.push({d,n:i.name,t:i.type=="fd"?"fd":"due",a:+i.amt||0,c:i.cur,id:i.id}))});
  S.loans.forEach(l=>{const f=incOverdue&&l.next&&l.next<from?l.next:from;loanOcc(l,f,to).forEach(d=>L.push({d,n:"EMI: "+l.name,t:"emi",a:+l.emi||0,c:l.cur,id:l.id}))});
  S.rec.forEach(r=>recOcc(r,from,to).forEach(d=>L.push({d,n:r.cat||r.note||"Recurring",t:r.kind=="in"?"recin":"rec",a:+r.amt||0,c:ac(r.acc).cur,id:r.id})));
  return L.sort((a,b)=>a.d.localeCompare(b.d))}

/* investments and net worth */
const invVal=(x,any)=>x.closed&&!any?0:(+x.val||+x.inv||0);
const fdEst=x=>{if(!(+x.rt&&x.sd&&x.mdate&&+x.inv))return 0;const y=(D(x.mdate)-D(x.sd))/31557600000;return y>0?x.inv*Math.pow(1+x.rt/400,4*y):0};
function invRet(x){const i=+x.inv||0,val=invVal(x);if(!i)return {abs:null,yr:null};let yr=null;if(x.sd){const y=(Date.now()-D(x.sd))/31557600000;if(y>=.25&&val>0)yr=(Math.pow(val/i,1/y)-1)*100}return {abs:(val/i-1)*100,yr}}
function nwParts(to){return {acc:tot(to),inv:S.inv.reduce((s,x)=>s+cv(invVal(x),x.cur,to),0),goal:S.goals.reduce((s,g)=>s+cv(+g.saved||0,g.cur,to),0),loan:S.loans.reduce((s,l)=>s+cv(loanOut(l),l.cur,to),0)}}
const nwv=to=>{const p=nwParts(to||"INR");return p.acc+p.inv+p.goal-p.loan};
function snapNW(){S.nw[today()]=Math.round(nwv("INR"));Object.keys(S.nw).sort().slice(0,-120).forEach(k=>delete S.nw[k])}

/* cross-currency transfers */
function remits(){return S.tx.filter(x=>x.kind=="tr"&&ac(x.acc).cur!=ac(x.to).cur&&+x.amt&&+x.got).map(x=>{const q=ac(x.acc).cur=="QAR";return {x,qar:q?+x.amt:+x.got,inr:q?+x.got:+x.amt,rate:q?x.got/x.amt:x.amt/x.got}}).sort((a,b)=>a.x.date.localeCompare(b.x.date))}

/* ===== charts (inline SVG) ===== */
const PAL=["#14b8a6","#6366f1","#f59e0b","#ef4444","#8b5cf6","#22c55e","#0ea5e9","#ec4899"];
const LEG='<div class="leg"><span><i style="background:var(--late)"></i>Spent</span><span><i style="background:var(--pri)"></i>Income</span><span><i style="background:var(--soon)"></i>Saved</span></div>';
const tip=t=>`data-act="tip" data-id="${esc(t)}"`;
/* grouped bars; data=[{l,<key>:n}], negative values hang below the zero line */
function bars(data,ks,cols){const W=320,H=130,vals=data.flatMap(d=>ks.map(k=>+d[k]||0)),mx=Math.max(1,...vals),mn=Math.min(0,...vals),rg=mx-mn,top=14,gw=(W-10)/data.length,bw=Math.min(18,(gw-8)/ks.length),y0=top+mx/rg*(H-top);
  let s=`<svg viewBox="0 0 ${W} ${H+24}" width="100%" role="img">`;if(mn<0)s+=`<line x1="5" y1="${y0}" x2="${W-5}" y2="${y0}" stroke="var(--line)"/>`;
  data.forEach((d,i)=>{const x0=5+i*gw+(gw-bw*ks.length)/2;
    ks.forEach((k,j)=>{const val=+d[k]||0,h=Math.abs(val)/rg*(H-top),y=val>=0?y0-h:y0;
      s+=`<rect x="${x0+j*bw}" y="${y}" width="${bw-2}" height="${val?Math.max(h,2):0}" rx="3" fill="${val<0?"var(--late)":cols[j]}" ${tip(d.l+": "+sh(val))}/>`;
      if(ks.length==1&&val)s+=`<text x="${x0+bw/2-1}" y="${val>=0?y-4:Math.min(y+h+11,H+8)}" text-anchor="middle" font-size="10" fill="var(--mute)">${sh(val)}</text>`});
    s+=`<text x="${5+i*gw+gw/2}" y="${H+19}" text-anchor="middle" font-size="11" fill="var(--mute)">${esc(d.l)}</text>`});
  return s+"</svg>"}
function hbars(items,ff){ff=ff||fm;const mx=Math.max(1,...items.map(i=>Math.abs(i[1])));return items.map(([n,val])=>`<div class="hb"><div class="hbl"><span>${esc(n)}</span><b>${ff(val)}</b></div><div class="hbt"><i style="width:${Math.abs(val)/mx*100}%;background:var(--pri)"></i></div></div>`).join("")}
function donut(items,ff){ff=ff||fm;const tt=items.reduce((a,i)=>a+i[1],0)||1;let off=25;

  return `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 42 42" width="140" height="140" style="flex-shrink:0">${rings}<text x="21" y="22.5" text-anchor="middle" font-size="5" font-weight="700" fill="var(--ink)">${sh(tt)}</text></svg><div style="flex:1;min-width:150px">${items.map((it,k)=>`<div class="hbl" style="margin:5px 0"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${PAL[k%8]};margin-right:6px"></i>${esc(it[0])} (${Math.round(it[1]/tt*100)}%)</span><b>${ff(it[1])}</b></div>`).join("")}</div></div>`}
/* line with a soft fill; tight=true scales to the data range instead of zero (for exchange rates) */
function area(d,tight,dec){const W=320,H=120,vs=d.map(x=>x.v),hi=Math.max(...vs),lo=Math.min(...vs),pad=tight?Math.max((hi-lo)*.2,Math.abs(hi)*.002,.01):0,mx=tight?hi+pad:Math.max(1,hi),mn=tight?lo-pad:Math.min(0,lo),
  X=i=>10+i*(W-20)/Math.max(1,d.length-1),Y=val=>H-8-(val-mn)/((mx-mn)||1)*(H-24),pts=d.map((x,i)=>X(i)+","+Y(x.v)).join(" "),every=Math.ceil(d.length/6),lab=val=>dec?Number(val).toFixed(dec):sh(val);
  return `<svg viewBox="0 0 ${W} ${H+18}" width="100%" role="img"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pri)" stop-opacity=".45"/><stop offset="1" stop-color="var(--pri)" stop-opacity="0"/></linearGradient></defs><polygon points="${X(0)},${H} ${pts} ${X(d.length-1)},${H}" fill="url(#ag)"/><polyline points="${pts}" fill="none" stroke="var(--pri)" stroke-width="2.5" stroke-linejoin="round"/>${d.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="3.4" fill="var(--card)" stroke="var(--pri)" stroke-width="2" ${tip(x.l+": "+lab(x.v))}/>`).join("")}${d.map((x,i)=>i%every==0||i==d.length-1?`<text x="${X(i)}" y="${H+13}" text-anchor="${i==0?"start":i==d.length-1?"end":"middle"}" font-size="10" fill="var(--mute)">${esc(x.l)}</text>`:"").join("")}<text x="${W-6}" y="11" text-anchor="end" font-size="10" fill="var(--mute)">${lab(hi)}</text></svg>`}
const ring=p=>`<svg viewBox="0 0 36 36" width="46" height="46"><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--ok)" stroke-width="4"/><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--pri)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${p} ${100-p}" transform="rotate(-90 18 18)"/><text x="18" y="21.5" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink)">${p}%</text></svg>`;
/* calendar heatmap of spending for the selected month; t = that month's entries */
function heat(t){const y=+mon.slice(0,4),m=+mon.slice(5),n=dim(mon),off=(new Date(y,m-1,1).getDay()+6)%7,by={};t.filter(x=>x.kind=="out").forEach(x=>{const d=+x.date.slice(8);by[d]=(by[d]||0)+ca(x)});const mx=Math.max(1,...Object.values(by));
  return `<div class="hm">${"MTWTFSS".split("").map(c=>`<i>${c}</i>`).join("")}${Array(off).fill("<i></i>").join("")}${Array.from({length:n},(_,k)=>{const val=by[k+1]||0;return `<i ${tip("Day "+(k+1)+": "+fm(val))} style="cursor:pointer;background:${val?`color-mix(in srgb,var(--late) ${Math.round((.15+.75*val/mx)*100)}%,var(--ok))`:"var(--ok)"}">${k+1}</i>`}).join("")}</div><p class="note" style="margin-top:6px">Darker days mean more spending. Tap a day for the amount.</p>`}
/* two-part bar */
const split=(a,b)=>{const t=(a+b)||1;return `<div class="split"><i style="width:${a/t*100}%;background:var(--pri)"></i><i style="width:${b/t*100}%;background:var(--soon)"></i></div>`};
function timeline(){const t=today(),U=upcoming(t,plus(30),false).filter(u=>u.t!="rec"&&u.t!="recin").map(u=>[dl(u.d),u.n]);
  S.inv.forEach(x=>{if(x.mdate&&!x.closed){const n=dl(x.mdate);if(n>=0&&n<=30)U.push([n,x.name+" matures"])}});U.sort((a,b)=>a[0]-b[0]);if(!U.length)return "";const lastX=[-99,-99];
  return `<h2>Next 30 days</h2><div class="card"><svg viewBox="0 0 320 70" width="100%" role="img"><line x1="10" y1="40" x2="310" y2="40" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>${U.map((x,i)=>{const px=10+x[0]/30*300,row=i%2,lx=Math.min(285,Math.max(row?70:35,px)),show=lx-lastX[row]>=58;if(show)lastX[row]=lx;return `<g ${tip(x[1]+" · "+when(x[0]))} style="cursor:pointer"><circle cx="${px}" cy="40" r="7" fill="${x[0]<=7?"var(--soon)":"var(--pri)"}"/>${show?`<text x="${lx}" y="${row?62:24}" text-anchor="middle" font-size="9" fill="var(--mute)">${esc(x[1].replace(/^EMI: /,"").slice(0,11))}</text>`:""}</g>`}).join("")}<text x="10" y="58" font-size="9" fill="var(--mute)">Today</text><text x="310" y="58" font-size="9" text-anchor="end" fill="var(--mute)">30 days</text></svg></div>`}

/* ===== analysis: monthly report, forecast, health, checks, explanations ===== */
const histMonths=(m,n)=>[1,2,3,4,5,6].map(j=>addMon(m,-j)).filter(x=>S.tx.some(q=>(q.kind=="out"||q.kind=="in")&&q.date.startsWith(x))).slice(0,n);
const catTotals=m=>{const by={};mTx(m,"out").forEach(x=>{const c=x.cat||"Uncategorised";by[c]=(by[c]||0)+ca(x)});return Object.entries(by).sort((a,b)=>b[1]-a[1])};
const rateOf=(i,s)=>i>0?(i-s)/i*100:null;
/* this month, the month before, and the average of up to three earlier months that have entries */
function rep(m){const p=addMon(m,-1),h=histMonths(m,3),o={h};
  for(const k of ["out","in","save"])o[k]={cur:mSum(m,k),prev:mSum(p,k),avg:h.length?h.reduce((s,x)=>s+mSum(x,k),0)/h.length:null};
  o.rate={cur:rateOf(o.in.cur,o.out.cur),prev:rateOf(o.in.prev,o.out.prev),avg:o.in.avg?rateOf(o.in.avg,o.out.avg):null};return o}

/* plain-language summary of a month; returns HTML-safe sentences */
function summary(m){const R=rep(m),L=[],sp=R.out.cur,inc=R.in.cur,cm=today().slice(0,7),td=+today().slice(8),part=m==cm&&td<dim(m),fs=fixedSet(),fixed=sumV(mTx(m,"out").filter(x=>isFixed(x,fs)));
  if(!sp&&!inc&&!R.save.cur)return ["No entries for "+mlong(m)+" yet. Add spending or income to see a summary."];
  if(inc>0){const left=inc-sp;L.push(left>=0?`You received ${fmr(inc)} and spent ${fmr(sp)}, keeping ${fmr(left)} (${Math.round(left/inc*100)}% of income).`:`You spent ${fmr(sp)}, which is ${fmr(-left)} more than the ${fmr(inc)} you received.`)}
  else L.push(`You spent ${fmr(sp)}. No income is recorded for this month.`);
  if(R.out.prev>0&&sp>0){if(part&&td>=7){const proj=fixed+(sp-fixed)/td*dim(m),d=Math.round((proj/R.out.prev-1)*100);L.push(`At this pace the month ends near ${fmr(proj)}, ${Math.abs(d)}% ${d>=0?"above":"below"} last month.`)}
    else if(!part){const d=Math.round((sp/R.out.prev-1)*100);L.push(`Spending was ${Math.abs(d)}% ${d>=0?"higher":"lower"} than the month before.`)}}
  const C=catTotals(m);
  if(C.length&&sp>0){L.push(`${esc(C[0][0])} was the largest category at ${fmr(C[0][1])} (${Math.round(C[0][1]/sp*100)}% of spending).`);
    if(!part||td>=20){const pm=Object.fromEntries(catTotals(addMon(m,-1)));let best=null;C.forEach(([c,a])=>{const b=pm[c]||0;if(b>0&&a-b>(best?best[1]:0))best=[c,a-b]});if(best&&best[0]!=C[0][0])L.push(`${esc(best[0])} rose the most, up ${fmr(best[1])} on the month before.`)}}
  if(sp>0&&fixed>0)L.push(`Fixed costs made up ${Math.round(fixed/sp*100)}% of spending.`);
  return L}

function budUse(m){const t=mTx(m,"out");return S.bud.map(b=>{const s=t.filter(x=>(x.cat||"Other").toLowerCase()==String(b.cat).toLowerCase()).reduce((a,x)=>a+cv(x.amt,x.cur,b.cur),0);return {b,s,p:b.lim?Math.round(s/b.lim*100):0}})}
function emiLoad(){const R=rep(today().slice(0,7)),L=[];
  S.loans.forEach(l=>{if(loanLeft(l))L.push({l:l.name,v:iv(l.emi,l.cur)})});
  activeDues().forEach(i=>{const st=REP[i.rep][1];if(i.type=="emi"&&st&&+i.amt)L.push({l:i.name,v:iv(i.amt,i.cur)/st})});
  const recIn=S.rec.filter(r=>r.kind=="in").reduce((s,r)=>s+iv(r.amt,ac(r.acc).cur),0);
  return {L,emi:L.reduce((s,x)=>s+x.v,0),inc:recIn||R.in.avg||R.in.cur||0}}
const liquid=()=>tot(V(),k=>k.type!="card");
/* indicators with a traffic-light level; thresholds are common rules of thumb */
function health(m){const R=rep(m),H=[],cm=today().slice(0,7),r=R.rate.cur;
  H.push(r==null?{n:"Savings rate",v:"Add income entries to see this",l:"na"}:{n:"Savings rate",v:Math.round(r)+"% of income kept",l:r>=20?"good":r>=10?"warn":"bad",k:"rate:"+m,t:"A common target is 20% or more."});
  const need=R.out.avg||(m==cm?R.out.cur/Math.max(1,+today().slice(8))*dim(m):R.out.cur),liq=liquid();
  H.push(need>0?{n:"Emergency cover",v:(liq/need).toFixed(1)+" months of spending",l:liq/need>=6?"good":liq/need>=3?"warn":"bad",k:"emer",t:"A common target is 3 to 6 months."}:{n:"Emergency cover",v:"Add spending entries to see this",l:"na"});
  const E=emiLoad();H.push(!E.emi?{n:"EMI load",v:"No EMIs",l:"good"}:E.inc>0?{n:"EMI load",v:Math.round(E.emi/E.inc*100)+"% of income",l:E.emi/E.inc<=.3?"good":E.emi/E.inc<=.4?"warn":"bad",k:"emi",t:"A common limit is 30 to 40%."}:{n:"EMI load",v:"Add income entries to see this",l:"na",k:"emi"});
  const B=budUse(cm),over=B.filter(x=>x.p>100).length,near=B.filter(x=>x.p>=90&&x.p<=100).length;
  H.push(!B.length?{n:"Budgets",v:"No budgets set",l:"na"}:{n:"Budgets",v:over?`${over} over the limit`:near?`${near} close to the limit`:"All within limits",l:over?"bad":near?"warn":"good"});
  const t=today(),late=upcoming(t,t,true).filter(u=>(u.t=="due"||u.t=="emi")&&u.d<t).length;
  H.push({n:"Payments on time",v:late?`${late} overdue`:"Nothing overdue",l:late?"bad":"good",k:late?"due30":""});
  return H}

/* what the accounts can cover over the next 30 days */
function safeSpend(){const t=today(),U=upcoming(t,plus(30),true).filter(u=>u.t!="fd"&&u.t!="recin"&&u.a),need=U.reduce((s,u)=>s+iv(u.a,u.c),0),have=tot(V());return {have,need,safe:have-need,U}}
/* month-by-month estimate of the total balance */
function forecast(n){const t=today(),cm=t.slice(0,7),td=+t.slice(8),hist=histMonths(cm,3),planned=x=>!!x.rec||!!(x.link&&(x.link.t=="due"||x.link.t=="loan")),flexOf=m=>sumV(mTx(m,"out").filter(x=>!planned(x)));
  const flexAvg=hist.length?hist.reduce((s,m)=>s+flexOf(m),0)/hist.length:(td>=5?flexOf(cm)/td*dim(cm):flexOf(cm));
  const hasRecIn=S.rec.some(r=>r.kind=="in"),incAvg=hist.length?hist.reduce((s,m)=>s+mSum(m,"in"),0)/hist.length:0;
  let b=tot(V());const rows=[];
  for(let j=0;j<n;j++){const m=addMon(cm,j),U=upcoming(j?m+"-01":t,mEnd(m),j==0).filter(u=>u.a);let inc=0,fixed=0;
    U.forEach(u=>{const val=iv(u.a,u.c);if(u.t=="fd"||u.t=="recin")inc+=val;else fixed+=val});
    const est=hasRecIn?0:(j?incAvg:Math.max(0,incAvg-mSum(cm,"in"))),flex=j?flexAvg:Math.max(0,flexAvg*(dim(cm)-td)/dim(cm));
    b+=inc+est-fixed-flex;rows.push({m,inc:inc+est,est,planned:inc,fixed,flex,bal:b,U})}
  return rows}

/* data quality */
function dupes(){const seen=new Map(),out=[];S.tx.filter(x=>(x.kind=="out"||x.kind=="in"||x.kind=="save")&&!x.rec).forEach(x=>{const k=[x.date,x.kind,x.acc,x.amt,(x.cat||"").toLowerCase()].join("|");if(seen.has(k))out.push(x);else seen.set(k,x)});return out}
const staleAcc=()=>S.acc.filter(a=>S.tx.some(x=>x.acc==a.id||x.to==a.id)&&(!a.rcd||dl(a.rcd)<-30));
const bothEmi=()=>activeDues().filter(i=>i.type=="emi"&&S.loans.some(l=>loanLeft(l)&&same(l.name,i.name)));
function checks(){const C=[],pl=(n,a,b)=>n==1?a:b,
  un=S.tx.filter(x=>(x.kind=="out"||x.kind=="in"||x.kind=="save")&&!x.cat),dp=dupes(),st=staleAcc(),na=activeDues().filter(i=>!+i.amt),bo=bothEmi();
  if(un.length)C.push({t:`${un.length} ${pl(un.length,"entry has","entries have")} no category`,k:"chk:uncat"});
  if(dp.length)C.push({t:`${dp.length} possible duplicate ${pl(dp.length,"entry","entries")}`,k:"chk:dup"});
  if(st.length)C.push({t:`${st.length} ${pl(st.length,"account hasn’t","accounts haven’t")} been checked against the bank in 30 days`,k:"chk:acc"});
  if(na.length)C.push({t:`${na.length} due ${pl(na.length,"date has","dates have")} no amount`,k:"chk:noamt"});
  if(bo.length)C.push({t:`${bo.length} ${pl(bo.length,"EMI is","EMIs are")} listed under both Dues and Loans, so ${pl(bo.length,"it is","they are")} counted twice`,k:"chk:both"});

  if(usesQar&&(!S.cfg.rateAt||dl(S.cfg.rateAt)<-30))C.push({t:`The QAR rate (₹${fx()}) hasn’t been updated ${S.cfg.rateAt?"since "+fmt(S.cfg.rateAt):"in the last 30 days"}. Check it on the Spend tab`,k:""});
  return C}

/* "tap a number to see what is in it" */
function explainData(key){const p=key.split(":"),a=p[0],t=today();
  const txr=x=>({id:x.id,l:(x.cat||KIND[x.kind])+(x.sub?" › "+x.sub:""),s:fmt(x.date)+" · "+an(x.acc)+(x.payee?" · "+x.payee:"")+(x.note?" · "+x.note:""),v:fm(ca(x))});
  const upr=(u,neg)=>({l:u.n,s:fmt(u.d)+(u.d<t?" · overdue":""),v:(neg?"−":"")+fm(iv(u.a,u.c))});
  if(a=="m"){const k=p[1],m=p[2],accId=p[3],fs=fixedSet();let L=S.tx.filter(x=>x.date.startsWith(m)&&(!accId||x.acc==accId));
    L=k=="fixed"?L.filter(x=>x.kind=="out"&&isFixed(x,fs)):k=="flex"?L.filter(x=>x.kind=="out"&&!isFixed(x,fs)):L.filter(x=>x.kind==k);L.sort((x,y)=>ca(y)-ca(x));
    const nm={out:"Spent",in:"Income",save:"Saved",fixed:"Fixed costs",flex:"Flexible spending"}[k],
    how={out:"Every Spent entry dated in this month. Transfers between your accounts are not counted.",in:"Every Income entry dated in this month. Transfers, FD maturities and balance corrections are not counted.",save:"Every Saved entry in this month, including money put into goals and investments.",fixed:"Spending from recurring entries, due dates, EMIs and your fixed-cost categories.",flex:"Spending that is not a fixed cost."}[k];
    return {t:nm+" in "+mlong(m),how:how+(accId?" Only "+esc(an(accId))+".":""),rows:L.map(txr),tot:fm(sumV(L))}}
  if(a=="rate"){const R=rep(p[1]);return {t:"Savings rate, "+mlong(p[1]),how:"Income minus spending, as a share of income.",rows:[{l:"Income",v:fm(R.in.cur)},{l:"Spent",v:"−"+fm(R.out.cur)},{l:"Kept",v:fm(R.in.cur-R.out.cur)}],tot:R.rate.cur==null?"":Math.round(R.rate.cur)+"%"}}
  if(a=="due30"){const U=upcoming(t,plus(30),true).filter(u=>u.t=="due"||u.t=="emi");return {t:"Due in the next 30 days",how:"Unpaid due dates and loan EMIs up to "+fmt(plus(30))+", including anything overdue. FD maturities are not counted.",rows:U.map(u=>upr(u)),tot:fm(U.reduce((s,u)=>s+iv(u.a,u.c),0))}}
  if(a=="safe"){const sf=safeSpend();return {t:"Safe to spend, next 30 days",how:"What your accounts hold now, minus dues, EMIs and recurring payments in the next 30 days. Income not yet received is left out.",rows:[{l:"In your accounts now",v:fm(sf.have)},...sf.U.map(u=>upr(u,true))],tot:fmr(sf.safe)}}
  if(a=="nw"){const rows=[];S.acc.forEach(k=>rows.push({l:k.name,s:ATYPE[k.type]||"Account",v:fm(iv(bal(k),k.cur))}));S.inv.filter(x=>!x.closed).forEach(x=>rows.push({l:x.name,s:IK[x.kind],v:fm(iv(invVal(x),x.cur))}));
    S.goals.forEach(g=>{if(+g.saved)rows.push({l:g.name,s:"Goal savings",v:fm(iv(g.saved,g.cur))})});S.loans.forEach(l=>{if(loanLeft(l))rows.push({l:l.name,s:"Loan still to pay",v:"−"+fm(iv(loanOut(l),l.cur))})});
    return {t:"Net worth",how:"Account balances, plus investments and goal savings, minus what is still owed on loans.",rows,tot:fm(nwv(V()))}}
  if(a=="emer"){const R=rep(mon||t.slice(0,7)),need=R.out.avg||R.out.cur;return {t:"Emergency cover",how:"Cash, bank and wallet balances divided by your average monthly spending"+(need?" ("+fmr(need)+")":"")+". Credit cards are left out.",rows:S.acc.filter(k=>k.type!="card").map(k=>({l:k.name,v:fm(iv(bal(k),k.cur))})),tot:fm(liquid())}}
  if(a=="emi"){const E=emiLoad();return {t:"EMI load",how:"Monthly EMIs divided by monthly income"+(E.inc?" ("+fmr(E.inc)+")":"")+".",rows:E.L.map(x=>({l:x.l,v:fm(x.v)})),tot:fm(E.emi)}}
  if(a=="fc"){const r=forecast(6)[+p[1]];if(!r)return null;const rows=[];
    r.U.forEach(u=>rows.push(upr(u,u.t!="fd"&&u.t!="recin")));if(r.est)rows.push({l:"Expected income",s:"Average of recent months",v:fmr(r.est)});if(r.flex)rows.push({l:"Everyday spending",s:"Average of recent months, without planned items",v:"−"+fmr(r.flex)});
    return {t:"Forecast for "+mlong(r.m),how:"An estimate. Planned items come from your due dates, EMIs and recurring entries. Everyday spending and income use your recent averages.",rows,tot:fmr(r.bal)}}
  if(a=="chk"){const k=p[1];
    if(k=="uncat"){const L=S.tx.filter(x=>(x.kind=="out"||x.kind=="in"||x.kind=="save")&&!x.cat);return {t:"Entries with no category",how:"Tap an entry to add a category, so reports can group it.",rows:L.map(txr)}}
    if(k=="dup")return {t:"Possible duplicates",how:"Same date, account, amount and category as another entry. Tap one to check it and delete it if it is a repeat.",rows:dupes().map(txr)};
    if(k=="acc")return {t:"Accounts to check",how:"Open Accounts and tap Correct on each one. Enter the bank’s balance, or confirm that it matches.",rows:staleAcc().map(x=>({l:x.name,s:x.rcd?"Last checked "+fmt(x.rcd):"Never checked",v:fmx(bal(x),x.cur)}))};
    if(k=="noamt")return {t:"Due dates with no amount",how:"Add the amount on the Dues tab so totals and forecasts include them.",rows:activeDues().filter(i=>!+i.amt).map(i=>({l:i.name,s:fmt(i.date),v:""}))};
    if(k=="both")return {t:"Listed twice",how:"These EMIs are on the Dues tab and also tracked under Loans. Delete the Dues copy so they are counted once.",rows:bothEmi().map(i=>({l:i.name,s:fmt(i.date),v:fmx(i.amt,i.cur)}))}}
  return null}

/* ===== views: one function per tab ===== */
function applyUI(){try{const r=document.documentElement;if(S.cfg.theme)r.setAttribute("data-theme",S.cfg.theme);else r.removeAttribute("data-theme");document.body.classList.toggle("hide",!!S.cfg.hide)}catch(e){}}
function countUp(){if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  $$(".hero .big").forEach(e=>{const t=e.textContent,m=t.match(/[\d,]+(\.\d+)?/);if(!m)return;const n=parseFloat(m[0].replace(/,/g,"")),pre=t.slice(0,m.index),suf=t.slice(m.index+m[0].length),dec=(m[1]||"").length;if(!isFinite(n)||n<1)return;const t0=performance.now();
    (function f(now){const p=Math.min(1,(now-t0)/600),val=n*(1-Math.pow(1-p,3));e.textContent=pre+val.toLocaleString("en-IN",{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;if(p<1)requestAnimationFrame(f)})(t0)})}
function render(){
  $("#nav").innerHTML=navHtml();
  let h;try{h=({home:vHome,dates:vDates,invest:vWealth,acc:vAcc,spend:vSpend,rep:vRep})[tab]()}

  budUse(t.slice(0,7)).forEach(u=>{if(u.p>=90)A.push([-999,"Budget: "+u.b.cat+" at "+u.p+"%",""])});docAlerts().forEach(a=>A.push(a));
  {const at=allAtt().length;if(at&&(!S.cfg.lastFullBk||dl(S.cfg.lastFullBk)<-31))A.push([998,at+(at==1?" attached file isn’t":" attached files aren’t")+" in a backup. Open Settings and backup, then Backup with files",""])}

function vHome(){const t=today(),cm=t.slice(0,7),U=upcoming(t,plus(30),true).filter(u=>u.t=="due"||u.t=="emi"),sum=U.reduce((s,u)=>s+iv(u.a,u.c),0),late=U.filter(u=>u.d<t).length,ds=activeDues(),sf=safeSpend();

  ${timeline()}
  <h2>Money</h2><div class="stats" style="grid-template-columns:1fr 1fr">${tile("In accounts",fm(tot(V())),"")}${tile("Net worth",fm(nwv(V())),"nw")}</div>

/* ---------- Dues ---------- */
function dueMonths(){const t=today(),cm=t.slice(0,7);return [...Array(6)].map((_,j)=>{const m=addMon(cm,j);return {l:mlab(m),v:upcoming(j?m+"-01":t,mEnd(m),j==0).filter(u=>u.t=="due"||u.t=="emi").reduce((s,u)=>s+iv(u.a,u.c),0)}})}
const dueChart=()=>{const d=dueMonths();return d.some(x=>x.v)?bars(d,["v"],["var(--pri)"]):`<p class="note">Add premiums or EMIs with an amount to see what is coming each month.</p>`};
function dateSummary(){const ds=activeDues();if(!ds.length)return "";const by={};let yr=0,fd=0;
  ds.forEach(i=>{const st=REP[i.rep][1],a=iv(+i.amt||0,i.cur),y=st?a*12/st:a;if(i.type=="fd")fd+=a;else{yr+=y;by[TYPES[i.type]]=(by[TYPES[i.type]]||0)+y}});

  return `<h1>Due dates</h1><p class="sub">Premiums, FD maturities, EMIs and renewals. Tap an item to edit.</p>${viewSeg()}<div class="acts" style="margin:10px 0 12px"><button class="btn" data-act="addDate">+ Add due date</button></div>${dueCal()}${dateSummary()}${ds.length?ds.map(dRow).join(""):`<div class="empty">Nothing here yet. Tap + Add due date.</div>`}${dn.length?`<details><summary>Completed (${dn.length})</summary>${dn.map(dRow).join("")}</details>`:""}${docsHtml()}`}

function vWealth(){const L=S.inv.filter(x=>!x.closed),cl=S.inv.filter(x=>x.closed),ti=L.reduce((s,x)=>s+iv(+x.inv||0,x.cur),0),tv=L.reduce((s,x)=>s+iv(invVal(x),x.cur),0),g=tv-ti,by={};

function remitCard(R){if(!R.length)return "";const q=R.reduce((s,r)=>s+r.qar,0),n=R.reduce((s,r)=>s+r.inr,0),fee=R.reduce((s,r)=>s+cv(+r.x.fee||0,ac(r.x.acc).cur,"INR"),0),rs=R.map(r=>r.rate);

function catDonut(t){const by={};t.filter(x=>x.kind=="out").forEach(x=>{const c=x.cat||"Uncategorised";by[c]=(by[c]||0)+ca(x)});const d=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  if(!d.length)return `<p class="note">No spending recorded for this month.</p>`;const top=d.slice(0,7),rest=d.slice(7).reduce((s,x)=>s+x[1],0);if(rest)top.push(["Everything else",rest]);return donut(top)}
function spendDetail(t){if(!t.length)return "";const o=t.filter(x=>x.kind=="out"),sp=sumV(o),inc=sumV(t.filter(x=>x.kind=="in")),sv=sumV(t.filter(x=>x.kind=="save")),cur=mon==today().slice(0,7),days=cur?+today().slice(8):dim(mon),big=[...o].sort((a,b)=>ca(b)-ca(a))[0];

function vSpend(){if(S.cfg.fa&&!S.acc.some(a=>a.id==S.cfg.fa))S.cfg.fa="";

  <div class="stats">${tile("Spent",fm(f("out")),key("out"))}${tile("Income",fm(f("in")),key("in"))}${tile("Saved",fm(f("save")),key("save"))}</div>${spendDetail(all)}

  <h2>Money health</h2><div class="card">${H.map(x=>`<div class="hrow"${x.k?` data-act="explain" data-id="${x.k}" style="cursor:pointer"`:""}><span class="dot ${x.l}"></span><div><b>${x.n}</b><small>${x.v}${x.t?" · "+x.t:""}</small></div></div>`).join("")}<p class="note" style="margin-top:8px">Green, amber and red follow common rules of thumb. They are not personal financial advice.</p></div>
  <h2>Cash-flow forecast</h2><div class="card"><div class="hbl" data-act="explain" data-id="safe" style="cursor:pointer"><span>Safe to spend, next 30 days</span><b style="color:${sf.safe<0?"var(--late)":"inherit"}">${sf.safe<0?"Short by "+fmr(-sf.safe):fmr(sf.safe)}</b></div><div style="height:8px"></div>${bars(F6.map(r=>({l:mlab(r.m),v:r.bal})),["v"],["var(--pri)"])}
  <table class="tbl"><tr><th>Month</th><th>In</th><th>Out</th><th>Balance at end</th></tr>${F6.map((r,j)=>`<tr data-act="explain" data-id="fc:${j}" style="cursor:pointer"><td>${mlab(r.m)}</td><td>${fmr(r.inc)}</td><td>${fmr(r.fixed+r.flex)}</td><td><b style="color:${r.bal<0?"var(--late)":"inherit"}">${fmr(r.bal)}</b></td></tr>`).join("")}</table>
  <p class="note" style="margin-top:8px">An estimate from your dues, EMIs, recurring entries and recent averages.${F6.some(r=>r.bal<0)?" The balance goes below zero in at least one month.":""}</p></div>
  <h2>Fixed and flexible spending</h2><div class="card">${sp?split(fixed,flex)+`<div class="stats" style="grid-template-columns:1fr 1fr;margin-top:10px">${tile("Fixed",fmr(fixed),"m:fixed:"+m,Math.round(fixed/sp*100)+"% of spending")}${tile("Flexible",fmr(flex),"m:flex:"+m,Math.round(flex/sp*100)+"% of spending")}</div>`:`<p class="note">No spending recorded for this month.</p>`}</div>
  <h2>Where it went</h2><div class="card">${catDonut(out)}</div>
  <h2>Last 6 months</h2><div class="card">${chart6()}</div>
  <h2>Dues and EMIs, next 6 months</h2><div class="card">${dueChart()}</div>`;
  /* payees and tags */
  const grp=(f)=>{const by={};out.forEach(x=>f(x).forEach(k=>{by[k]=(by[k]||0)+ca(x)}));return Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,6)},py=grp(x=>x.payee?[x.payee]:[]),tg=grp(x=>(x.tags||[]).map(s=>"#"+s));
  if(py.length)h+=`<h2>Top payees</h2><div class="card">${hbars(py)}</div>`;
  if(tg.length)h+=`<h2>Spending by tag</h2><div class="card">${hbars(tg)}</div>`;
  /* investments */
  const L=S.inv.filter(x=>!x.closed);
  if(L.length){h+=`<h2>Investment returns</h2><div class="card"><table class="tbl"><tr><th>Investment</th><th>Gain</th><th>Per year</th></tr>${L.map(x=>{const r=invRet(x);return `<tr><td>${esc(x.name)}</td><td>${r.abs==null?"–":`<span class="${r.abs<0?"bd":"gd"}">${r.abs>=0?"+":""}${r.abs.toFixed(1)}%</span>`}</td><td>${r.yr==null?"–":r.yr.toFixed(1)+"%"}</td></tr>`}).join("")}</table><p class="note" style="margin-top:8px">Per year is an approximate yearly rate from the start date. It needs a start date at least 3 months back.</p></div>`;
    const lad=L.filter(x=>x.mdate&&dl(x.mdate)>=0).sort((a,b)=>a.mdate.localeCompare(b.mdate));
    if(lad.length){const by={};lad.forEach(x=>{const y=x.mdate.slice(0,4);by[y]=(by[y]||0)+iv(fdEst(x)||invVal(x),x.cur)});
      h+=`<h2>Maturity ladder</h2><div class="card">${hbars(Object.entries(by),fmr)}<div style="height:6px"></div>${lad.map(x=>`<div class="hbl" style="margin:6px 0"><span>${esc(x.name)} · ${fmt(x.mdate)}</span><b>${fmx(Math.round(fdEst(x)||invVal(x)),x.cur)}</b></div>`).join("")}</div>`}}
  /* loans */
  const LN=S.loans.filter(loanLeft);
  if(LN.length)h+=`<h2>Loans</h2><div class="card">${LN.map(l=>{const o=loanOut(l),left=loanLeft(l),int=Math.max(0,left*l.emi-o);return `<div style="margin-bottom:10px"><div class="hbl"><span><b>${esc(l.name)}</b></span><b>${fmx(Math.round(o),l.cur)}</b></div><small style="color:var(--mute)">${left} EMIs left · ends ${mlong(loanEnd(l).slice(0,7))}${+l.rate?" · about "+fmx(Math.round(int),l.cur)+" interest still to pay":""}</small></div>`}).join("")}
    <b>Prepayment calculator</b>${SEL("pp_loan","Loan",LN.map(l=>[l.id,l.name]),LN[0].id)}${F("pp_amt","Extra amount to pay now","","number")}<div class="acts"><button class="btn" data-act="prepay">Calculate</button></div><p class="note" id="pp_out"></p></div>`;
  /* remittances */
  const RM=remits();
  if(RM.length){const by={};RM.forEach(r=>{const k=r.x.date.slice(0,7);by[k]=(by[k]||0)+r.inr});const ms=[...Array(6)].map((_,j)=>addMon(t.slice(0,7),j-5)),last=RM.slice(-12);
    h+=`<h2>QAR ↔ INR transfers</h2><div class="card"><small style="color:var(--mute)">Rupees moved each month</small>${bars(ms.map(k=>({l:mlab(k),v:by[k]||0})),["v"],["var(--pri)"])}${last.length>1?`<small style="color:var(--mute)">Rate you got (₹ per QAR)</small>${area(last.map(r=>({l:+r.x.date.slice(8)+" "+mlab(r.x.date.slice(0,7)),v:r.rate})),true,2)}`:`<p class="note">Your rate so far: ₹${last[0].rate.toFixed(2)} per QAR. A chart appears after a second transfer.</p>`}</div>`}
  h+=moreRep(m)+planHtml();
  /* checks */
  h+=`<h2>Data checks</h2><div class="card">${C.length?C.map(c=>`<div class="hrow"${c.k?` data-act="explain" data-id="${c.k}" style="cursor:pointer"`:""}><span class="dot warn"></span><div><b>${esc(c.t)}</b></div></div>`).join(""):`<div class="hrow"><span class="dot good"></span><div><b>No problems found in your entries.</b></div></div>`}</div>`;
  return h}

let pend=[],orig=[],added=[];

function attHtml(){return `<label for="f_file">Attachments (photos or PDFs, up to 10 MB each)</label><div id="attlist">${attList()}</div><select id="f_dt" style="margin-bottom:6px" aria-label="Document type">${["Policy bond","Premium receipt","KYC document","Statement","Other"].map(x=>`<option>${x}</option>`).join("")}</select><input id="f_file" type="file" accept="image/*,application/pdf" multiple data-file="1">`}
async function addFiles(fs){for(const f of fs){if(f.size>10485760){toast(f.name+" is over 10 MB");continue}
    try{const id=uid();await fput(id,f);pend.push({id,name:f.name,type:f.type,size:f.size,lab:v("f_dt")});added.push(id)}catch(e){toast("Couldn’t store "+f.name+" on this device")}}
  const l=$("#attlist");if(l)l.innerHTML=attList()}
function attDone(saved){const keep=saved?pend.map(a=>a.id):orig;[...added,...orig].forEach(id=>{if(!keep.includes(id))fdel(id)});pend=[];added=[];orig=[]}
async function viewAtt(id){const m=pend.find(a=>a.id==id)||allAtt().find(a=>a.id==id)||{name:"File",type:""};
  try{const b=await fget(id);if(!b)throw 0;const u=URL.createObjectURL(b),im=(m.type||b.type||"").startsWith("image/");

  catch(e){toast("Couldn’t open that file")}}

function trForm(t){t=t||null;const f=t?t.acc:(S.cfg.last&&ac(S.cfg.last).id||S.acc[0].id),to=t?t.to:(S.acc.find(k=>k.id!=f)||{}).id||"";

function trSync(keep){const A=ac(v("f_from")),B=ac(v("f_to")),s=+v("f_amt")||0,g=$("#f_got");if(!g)return;$("#l_amt").textContent="Amount sent ("+A.cur+")";$("#l_got").textContent="Amount received ("+B.cur+")";

/* hand a generated file to the person: Claude's download prompt, then the share sheet, then a browser download */
async function saveFile(name,text,mime){
  if(isApp()){try{await NP("DueNative","saveDownload",{name,text,mime});toast("Saved to Downloads/DueAndSpend");return true}catch(e){}}
  if(inClaude()){try{const dn=await claude.use("downloads");if(dn){await dn.save({filename:name,data:text});return true}}catch(e){if(e&&e.code=="declined")return false}
    try{await navigator.clipboard.writeText(text);toast("Copied instead. Paste it somewhere safe.")}catch(e){toast("Couldn’t save a file here. Use Copy under backup text.")}return false}
  const f=new File([text],name,{type:mime});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}}catch(e){if(e&&e.name=="AbortError")return false}
  try{const u=URL.createObjectURL(f),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Saving "+name+"…");return true}
  catch(e){try{await navigator.clipboard.writeText(text);toast("Copied to clipboard")}catch(x){toast("Couldn’t export here")}return false}}
function ics(){const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//DueSpend//EN"],d8=s=>s.replace(/-/g,""),nx=s=>{const e=D(s);e.setDate(e.getDate()+1);return d8(iso(e))};
  const ev=(id,t,d,rr)=>{L.push("BEGIN:VEVENT","UID:"+id+"@duespend","DTSTAMP:"+d8(today())+"T000000Z","DTSTART;VALUE=DATE:"+d8(d),"DTEND;VALUE=DATE:"+nx(d),"SUMMARY:"+String(t).replace(/[,;\r\n]/g," "));if(rr)L.push("RRULE:"+rr);L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Due soon","TRIGGER:-P2D","END:VALARM","END:VEVENT")};
  activeDues().forEach(i=>{const s=REP[i.rep][1];ev(i.id,i.name+" ("+TYPES[i.type]+")"+(+i.amt?" "+(i.cur=="QAR"?"QAR ":"Rs ")+i.amt:""),i.date,s?(s==12?"FREQ=YEARLY":"FREQ=MONTHLY;INTERVAL="+s):"")});
  S.loans.forEach(l=>{if(l.next&&loanLeft(l))ev(l.id,"EMI: "+l.name,l.next,"FREQ=MONTHLY;COUNT="+loanLeft(l))});S.inv.forEach(x=>{if(x.mdate&&!x.closed)ev(x.id,"Matures: "+x.name,x.mdate)});
  L.push("END:VCALENDAR");return L.join("\r\n")}
function csv(){const r=[["Date","Type","Account","To account","Currency","Amount","Category","Sub-category","Paid to/from","Tags","Note","Linked to"]];
  [...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>r.push([x.date,KIND[x.kind]||x.kind,an(x.acc),x.kind=="tr"?an(x.to):"",x.cur||"INR",x.amt,x.cat||"",x.sub||"",x.payee||"",(x.tags||[]).join(" "),x.note||"",x.link?x.link.t:""]));
  return r.map(a=>a.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n")}

/* Records merge by id: the newer edit wins. Deleted ids are remembered (S.del), so a delete on one device
   is not undone by another device's copy; a record edited or restored after the delete wins over it. */
const tombMap=a=>{const m=new Map();(a||[]).forEach(t=>{if(t&&t.id&&(!m.has(t.id)||m.get(t.id)<t.at))m.set(t.id,+t.at||0)});return m};
const dead=(x,tm)=>tm.has(x.id)&&tm.get(x.id)>=(x.ut||0);
function mergeColl(L,R,tm,preferLocal){const m=new Map();(R||[]).forEach(r=>m.set(r.id,r));
  (L||[]).forEach(l=>{const r=m.get(l.id);if(!r)m.set(l.id,l);else{const a=l.ut||0,b=r.ut||0;m.set(l.id,a>b?l:b>a?r:preferLocal?l:r)}});
  return [...m.values()].filter(x=>!dead(x,tm))}
/* older versions kept transfers in their own list */
function normR(R){R=R||{};if(Array.isArray(R.tr)&&R.tr.length){const have=new Set((R.tx||[]).map(x=>x.id));R.tx=[...(R.tx||[]),...R.tr.filter(t=>!have.has(t.id)).map(t=>({id:t.id,kind:"tr",acc:t.from,to:t.to,amt:+t.amt||0,got:+t.got||0,fee:+t.fee||0,date:t.date,note:t.note||""}))]}delete R.tr;return R}
/* the merged state of this device and a remote copy; a list missing from R is left as it is here */
function mergeCalc(R,preferLocal){R=normR(R);const tm=tombMap([...(S.del||[]),...(R.del||[])]),o={},live=new Map(),lim=Date.now()-180*864e5;
  COLLS.forEach(c=>{o[c]=Array.isArray(R[c])?mergeColl(S[c],R[c],tm,preferLocal):(S[c]||[]).filter(x=>!dead(x,tm));o[c].forEach(x=>live.set(x.id,x.ut||0))});
  o.prefs=R.prefs&&(R.prefs.pu||0)>(S.cfg.pu||0)?R.prefs:prefsOut();
  o.del=[...tm].filter(([id,at])=>at>lim&&!(live.has(id)&&live.get(id)>at)).map(([id,at])=>({id,at}));return o}
function mergeInto(R,preferLocal){const o=mergeCalc(R,preferLocal);COLLS.forEach(c=>S[c]=o[c]);S.del=o.del;prefsIn(o.prefs);mig()}

  catch(e){sset("Sync unavailable here")}}
function takeRemote(R,gen,known,dirty){/* a higher generation means someone restored a backup: take their copy whole */
  if(known!=null&&(gen||0)>known){R=normR(R);COLLS.forEach(c=>{if(Array.isArray(R[c]))S[c]=R[c]});S.del=R.del||[];if(R.prefs){S.cfg.pu=0;prefsIn(R.prefs)}mig()}

function listen(){if(unsub)unsub();const ref=fdb.collection("spaces").doc(SY.space);
  unsub=ref.onSnapshot(sn=>{if(!sn.exists){SY.owner=true;syv();pushNow();return}if(sn.metadata.hasPendingWrites)return;const d=sn.data();SY.members=d.members||SY.members;SY.applying=true;
    try{if(!SY.force){takeRemote(JSON.parse(d.data||"{}"),d.gen,SY.gen,!!SY.dirty);SY.gen=d.gen||0}syv();persist();render()}catch(e){console.warn(e)}SY.applying=false;
    sset("Synced "+hhmm()+(d.by&&me&&d.by!==me.email?" · last edit by "+d.by:""));if(SY.dirty||SY.force)pushNow()},err=>sset("Sync error: "+(err.code||"check your rules")))}
async function pushNow(){if(!fdb||!me||!me.emailVerified||!SY.space)return;
  try{const ref=fdb.collection("spaces").doc(SY.space);let merged,gen;
    await fdb.runTransaction(async t=>{const sn=await t.get(ref),d=sn.exists?sn.data():null;gen=Math.max(d&&d.gen||0,SY.gen||0)+(SY.force?1:0);
      merged=SY.force||!d?{...Object.fromEntries(COLLS.map(c=>[c,S[c]])),del:S.del,prefs:prefsOut()}:mergeCalc(JSON.parse(d.data||"{}"),true);
      t.set(ref,{data:JSON.stringify(merged),members:d?(d.members||[]):[me.email,...(SY.members||[])],by:me.email,ts:Date.now(),gen})});
    SY.applying=true;COLLS.forEach(c=>S[c]=merged[c]);S.del=merged.del;prefsIn(merged.prefs);mig();SY.gen=gen;SY.force=false;SY.dirty=false;syv();persist();SY.applying=false;sset("Synced "+hhmm());render()}
  catch(e){SY.applying=false;sset("Sync error: "+(e.code||e.message))}}

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {

          }

      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
