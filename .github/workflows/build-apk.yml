# Builds an installable Android app (APK) from index.html, in GitHub's cloud.
# Put this file in your repo at:  .github/workflows/build-apk.yml
name: Build Android app
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['index.html', 'native_setup.py', '.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Keep one signing key, so updates install over the old app
        run: |
          if [ ! -f app-signing.keystore ]; then
            keytool -genkeypair -v -keystore app-signing.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Due and Spend"
            git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
            git add app-signing.keystore; git commit -m "Add app signing key"; git push
          fi
          mkdir -p ~/.android && cp app-signing.keystore ~/.android/debug.keystore
      - name: Wrap the page as an Android app
        run: |
          mkdir -p build/www && cp index.html manifest.json icon-192.png icon-512.png build/www/
          cd build
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap init "Due and Spend" com.duespend.app --web-dir www
          npx cap add android
          npx cap sync android
      - name: Add the widget, shortcuts, SMS reading, fingerprint and app icon
        run: |
          pip install pillow || true
          python3 native_setup.py build/android icon-512.png
      - name: Build
        run: cd build/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Publish the APK as a release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp build/android/app/build/outputs/apk/debug/app-debug.apk due-and-spend.apk
          gh release delete app --yes --cleanup-tag || true
          gh release create app due-and-spend.apk --title "Due and Spend Android app" --notes "Download due-and-spend.apk on your phone and open it to install."
