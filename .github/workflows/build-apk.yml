# Builds an installable Android app (APK) from index.html, in GitHub's cloud.
# Put this file in your repo at:  .github/workflows/build-apk.yml
name: Build Android app
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Keep one signing key, so updates install over the old app
        run: |
          if [ ! -f app-signing.keystore ]; then
            keytool -genkeypair -v -keystore app-signing.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Due and Spend"
            git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
            git add app-signing.keystore; git commit -m "Add app signing key"; git push
          fi
          mkdir -p ~/.android && cp app-signing.keystore ~/.android/debug.keystore
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Check the app before building (stops here if something is broken)
        run: |
          if [ -f ci-check.py ]; then
            pip install -q playwright==1.48.0
            python3 ci-check.py index.html
          else
            echo "ci-check.py isn't in the repo, so the check is skipped"
          fi
      - name: Wrap the page as an Android app
        run: |
          mkdir -p build/www && cp index.html manifest.json icon-192.png icon-512.png build/www/
          # tell the app its build number and where its updates and rules.json live
          sed -i "s#__REPO__#${{ github.repository }}#g; s#__BUILD__#${{ github.run_number }}#g" build/www/index.html
          cd build
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap init "Personal Diary" com.personaldiary.app --web-dir www
          npx cap add android
          npx cap sync android
      - name: Add the widget, shortcuts, SMS reading, fingerprint and app icon
        run: |
          pip install pillow || true
          # native_setup.py comes from this repo, so the APK always has the latest phone features
          python3 native_setup.py build/android icon-512.png
      - name: Build
        run: |
          cd build/android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle
          chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Sign with the app's own key, so updates install over the old app
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks app-signing.keystore --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey --out personal-diary.apk build/android/app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --print-certs personal-diary.apk | tee signer.txt
          grep -qi "68f3e44762b477acc7514b0121c0836bc037fb21e466a8e256164da95a6e87ce" signer.txt || { echo "APK is not signed with the app key"; exit 1; }
      - name: Publish the APK as a release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          test -f personal-diary.apk
          VER=$(grep -o 'VER="[0-9]*"' index.html | head -1 | grep -o '[0-9]*')
          # version.json tells the app a newer build exists; the commit message becomes "What's new"
          RUN=${{ github.run_number }} VER=$VER python3 -c "import json,os,subprocess,datetime;import re;m=subprocess.run(['git','log','-1','--pretty=%B'],capture_output=True,text=True).stdout;m='\\n'.join(l for l in m.splitlines() if not re.match(r'(co-authored-by|claude-session|signed-off-by):',l.strip(),re.I)).strip();json.dump({'code':int(os.environ['RUN']),'ver':os.environ['VER'],'date':datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),'notes':m[:800]},open('version.json','w'))"
          cat version.json
          gh release delete app --yes --cleanup-tag || true
          gh release create app personal-diary.apk version.json --title "Personal Diary Android app" --notes "Download personal-diary.apk on your phone and open it to install. Version $VER, build ${{ github.run_number }}."
