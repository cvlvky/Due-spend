      - name: Build
        run: |
          cd build/android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle
          chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Publish the APK as a release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp build/android/app/build/outputs/apk/debug/app-debug.apk personal-diary.apk
          gh release delete app --yes --cleanup-tag || true
          gh release create app personal-diary.apk --title "Personal Diary Android app" --notes "Download personal-diary.apk on your phone and open it to install."
